name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge patch updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only when every dependency in the PR is a patch bump. Minor and major
      # updates (including grouped PRs that contain one) wait for a human.
      - name: Enable auto-merge
        if: ${{ !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.update-type, 'version-update:semver-minor') && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.update-type, 'version-update:semver-major') }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
