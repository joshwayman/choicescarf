<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChoiceScarf | Pokémon Speed EV Calculator</title>
    <meta
      name="description"
      content="Work out the minimum Speed EVs your Pokémon needs to outspeed a target, for every nature, and whether you need a Choice Scarf."
    />
    <link rel="canonical" href="https://choicescarf.com/" />

    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#10111c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f8fb" media="(prefers-color-scheme: light)" />
    <!-- Apply a remembered theme before the first paint (see src/ui/theme.ts). -->
    <script>
      try {
        var t = localStorage.getItem('choicescarf:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!-- Link previews (Open Graph / Twitter / Discord / Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChoiceScarf" />
    <meta property="og:title" content="ChoiceScarf | Pokémon Speed EV Calculator" />
    <meta property="og:description" content="Work out the minimum Speed EVs your Pokémon needs to outspeed a target, for every nature, and whether you need a Choice Scarf." />
    <meta property="og:url" content="https://choicescarf.com/" />
    <meta property="og:image" content="https://choicescarf.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChoiceScarf: stop wasting Speed EVs. Pokémon speed calculator." />
    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
